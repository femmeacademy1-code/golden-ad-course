<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>איפוס סיסמה | מודעת הזהב</title>
<link rel="stylesheet" href="/ds.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&amp;display=swap">
<style>

@font-face { font-family: "Ploni Yad"; src: url("/assets/fonts/acd569cc9c5d522e2011e3c30f0b9c1d.woff2") format("woff2"), url("/assets/fonts/acd569cc9c5d522e2011e3c30f0b9c1d.woff") format("woff"); font-weight: 100 900; font-display: swap; }
:root { --color-bg: #FFF8F4; --color-text: #45464E; --color-accent: #B9504E; --color-accent-100: #FFEEE3; --color-accent-200: #FFD6BA; --color-accent-300: #F2B49C; --color-accent-400: #D9776F; --color-accent-600: #A44543; --color-accent-700: #933E3C; --color-accent-800: #6F2E2D; --color-accent-2: #BB9479; --color-accent-2-100: #E4F7F1; --color-accent-2-200: #DDF5EE; --color-accent-2-300: #C2EBDF; --color-accent-2-700: #7D5D47; --color-accent-2-800: #5F4636; --font-body: "Assistant", sans-serif; }
html { direction: rtl; overflow-x: clip; }
body { margin: 0; overflow-x: clip; background: var(--color-bg); color: var(--color-text); font-family: "Assistant", sans-serif; text-wrap: pretty; }
a { color: var(--color-accent-700); }
a:hover { color: var(--color-accent-800); }
.btn { font-family: "Assistant", sans-serif; white-space: nowrap; }

[hidden]{display:none!important}
</style>
</head>
<body>
<div dir="rtl" style="min-height:100vh;display:flex;flex-direction:column;position:relative;isolation:isolate;overflow-x:clip;">
  <nav class="nav" style="padding-inline:clamp(20px,5vw,72px);position:relative;z-index:2;">
    <a href="/" class="nav-brand" style="margin-right:0;margin-left:auto;display:flex;align-items:center;text-decoration:none;"><img src="/assets/logo-dark.png" alt="Biz Doula – דולה עסקית ליוצרות עצמאיות" style="height:84px;width:auto;display:block;"></a>
    <a href="/">לעמוד הקורס</a>
  </nav>

  <div style="position:absolute;left:-160px;top:-180px;width:440px;height:440px;border-radius:50%;background:var(--color-accent-2-200);z-index:-1;pointer-events:none;"></div>
  <div style="position:absolute;right:-120px;bottom:-140px;width:340px;height:340px;border-radius:50%;background:var(--color-accent-200);z-index:-1;pointer-events:none;"></div>

  <main style="flex:1;display:grid;place-items:center;padding:clamp(32px,6vw,72px) clamp(20px,5vw,72px);">
    <div style="width:100%;max-width:460px;position:relative;">
      <img src="/assets/doodle-butterfly.png" alt="" style="position:absolute;left:-28px;top:-44px;width:76px;transform:rotate(14deg);opacity:0.85;pointer-events:none;">
      <div style="background:var(--color-bg);border-radius:36px;padding:clamp(28px,5vw,48px);box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:22px;">
        <form id="reset-form" novalidate style="display:flex;flex-direction:column;gap:20px;">
            <div style="display:flex;flex-direction:column;gap:10px;">
              <span class="tag tag-accent-2" style="align-self:flex-start;font-size:16px;padding:8px 16px;">איפוס סיסמה</span>
              <h1 style="font-family:'Ploni Yad','Assistant',sans-serif;font-weight:400;font-size:clamp(34px,5vw,46px);line-height:1.2;margin:0;">בחירת סיסמה חדשה</h1>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <label for="r-pass" style="font-size:15px;font-weight:700;">סיסמה חדשה (לפחות 8 תווים)</label>
              <input id="r-pass" class="input" type="password" autocomplete="new-password" dir="ltr" style="border-radius:999px;text-align:right;font-size:16px;">
              <span id="r-err" style="font-size:14px;color:var(--color-accent-800);"></span>
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="font-size:18px;padding:16px 24px;">שמירה</button>
          </form>
        
      </div>
    </div>
  </main>

  <footer style="padding:24px clamp(20px,5vw,72px) 36px;font-size:14px;opacity:0.75;">מודעת הזהב · Femme Digital</footer>
</div>

<script>
document.getElementById('reset-form').addEventListener('submit',function(e){
  e.preventDefault();
  var err=document.getElementById('r-err'),pw=document.getElementById('r-pass').value,tok=new URLSearchParams(location.search).get('token')||'';
  if(pw.length<8){err.textContent='הסיסמה חייבת להיות לפחות 8 תווים';return;}
  fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok,password:pw})})
   .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
   .then(function(x){if(!x.ok){err.textContent=x.j.error||'שגיאה';return;}location.href='/login';})
   .catch(function(){err.textContent='שגיאת תקשורת, נסי שוב';});
});
</script>
</body>
</html>
